server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 1m;

    # SPA: статические файлы отдаём как есть, всё остальное — index.html,
    # чтобы работала история переходов в браузере.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API и healthcheck проксируются на Go-бэкенд внутри Docker-сети.
    # Браузер обращается к API по относительным URL на том же origin.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /healthz {
        proxy_pass http://api:8080;
    }
}
