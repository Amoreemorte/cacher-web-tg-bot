name: expense-bot

services:
  # Go REST API для веб-панели. Не публикует порт наружу — доступ через Nginx.
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: expense-bot/app:local
    command: ["server"]
    env_file:
      - .env
    environment:
      - DB_PATH=/data/expenses.db
      - HTTP_ADDR=:8080
    volumes:
      - expense-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s

  # Telegram-бот с ИИ-агентом. Использует тот же образ, что и api.
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: expense-bot/app:local
    command: ["bot"]
    env_file:
      - .env
    environment:
      - DB_PATH=/data/expenses.db
    volumes:
      - expense-data:/data
    restart: unless-stopped

  # Веб-панель: Nginx со статикой и проксированием /api на backend.
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: expense-bot/web:local
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  expense-data:
